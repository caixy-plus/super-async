server:
  port: 8081

spring:
  application:
    name: super-async

  datasource:
    url: jdbc:postgresql://localhost:5433/superasync?stringtype=unspecified
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/sa-migration
    baseline-on-migrate: true

superasync:
  node: ${SUPERASYNC_NODE:default-node}
  scheduler:
    poll-interval-ms: 5000
    batch-size: 50
  executor:
    core-pool-size: ${java.runtime.availableProcessors:4}
    max-pool-size: ${java.runtime.availableProcessors:4}
  retry:
    base-delay-seconds: 10
    max-delay-minutes: 30
  timeout:
    check-interval-ms: 60000
    default-timeout-minutes: 10
  retention:
    enabled: true
    cron: "0 0 2 * * ?"
    async-tasks-days: 30
    executions-days: 30
    scheduler-logs-days: 30
